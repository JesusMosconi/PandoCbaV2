name: Vencer órdenes de Prueba

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vencer-ordenes-prueba
  cancel-in-progress: false

jobs:
  vencer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código de la rama de prueba
        uses: actions/checkout@v4
        with:
          ref: 002-checkout-ordenes
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validar destino aislado
        env:
          DATABASE_URL: ${{ secrets.PRUEBA_DATABASE_URL }}
        run: |
          node --input-type=module -e '
            const valor = process.env.DATABASE_URL;
            if (!valor) throw new Error("Falta PRUEBA_DATABASE_URL");
            const url = new URL(valor);
            if (url.hostname !== "ep-floral-dust-acglee71-pooler.sa-east-1.aws.neon.tech" || url.pathname !== "/neondb") {
              throw new Error("La conexión no corresponde a la base aislada Prueba");
            }
          '

      - name: Instalar dependencias
        env:
          DATABASE_URL: ${{ secrets.PRUEBA_DATABASE_URL }}
        run: npm ci

      - name: Vencer órdenes
        env:
          DATABASE_URL: ${{ secrets.PRUEBA_DATABASE_URL }}
        run: npm run vencer-ordenes
